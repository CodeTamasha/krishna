name: Extract project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o Krishna_FULL_LATEST.zip -d temp

          cp -r temp/Krishna/. .

          rm -rf temp
          rm -f Krishna_FULL_LATEST.zip

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move project to repository root" || echo "Nothing to commit"
          git push
